<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cloud E-Library</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">☁️ <span>Cloud</span> E-Library</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="library.html">Library</a></li>
            <li><a href="index.html#categories">Categories</a></li>
            <li><a href="upload.html">Upload</a></li>
            <li><a href="login.html" class="active">Login</a></li>
        </ul>
    </nav>


    <!-- Login Section -->
    <section class="login-section">

        <div class="login-container">

            <div class="login-icon">🔐</div>

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Login to access your Cloud E-Library
            </p>

            <form class="login-form" method="POST">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#" class="forgot-password" onclick="alert('Password reset instructions will be sent to your registered email.'); return false;">
                        Forgot Password?
                    </a>

                </div>

                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>

            <p class="register-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 Cloud E-Library | All Rights Reserved</p>
    </footer>

    <script src="../js/script.js"></script>

</body>
</html>
